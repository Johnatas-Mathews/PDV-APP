<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo Grafite Premium com bordas arredondadas -->
  <rect width="512" height="512" rx="115" fill="#0f172a"/>
  
  <!-- Nome Principal: TECCO -->
  <text x="256" y="245" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" text-anchor="middle" letter-spacing="4">TECCO</text>
  
  <!-- Linha Divisória de Destaque -->
  <rect x="136" y="275" width="240" height="8" rx="4" fill="#3b82f6"/>
  
  <!-- Subtítulo: PDV -->
  <text x="256" y="355" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="52" text-anchor="middle" letter-spacing="12">PDV</text>
  
  <!-- Ponto de status / confirmação -->
  <circle cx="395" cy="155" r="16" fill="#10b981"/>
</svg>
